global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/aegis-alerts.yml

scrape_configs:
  - job_name: aegis-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials: ${AEGIS_METRICS_TOKEN}
    static_configs:
      - targets: [api:4174]

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:9464]
