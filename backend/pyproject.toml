[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ai-gateway"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.121,<1",
  "httpx>=0.28,<0.29",
  "opentelemetry-exporter-otlp-proto-http>=1.31,<2",
  "opentelemetry-sdk>=1.31,<2",
  "prometheus-client>=0.22,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "PyJWT[crypto]>=2.10,<3",
  "redis>=6,<7",
  "sqlalchemy[asyncio]>=2.0.40,<2.1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
aegis-admin = "aegis.admin:main"
aegis-worker = "aegis.worker:main"

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.setuptools.package-data]
aegis = ["sql/*.lua"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires disposable PostgreSQL and Redis"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110
