name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@v3

  dependencies-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend dependency audit
        working-directory: backend
        run: npm install --ignore-scripts --no-audit --no-fund && npm audit --audit-level=high
      - name: Frontend dependency audit
        working-directory: frontend
        run: npm install --ignore-scripts --no-audit --no-fund && npm audit --audit-level=high
      - name: Secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

  containers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --pull -t aegis-backend:ci backend
      - name: Build frontend image
        run: docker build --pull -t aegis-frontend:ci frontend
      - name: Scan backend container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: aegis-backend:ci
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Scan frontend container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: aegis-frontend:ci
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"

  signed-release-images:
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: backend
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ github.repository }}-backend:${{ github.ref_name }}
          sbom: true
          provenance: mode=max
      - uses: docker/build-push-action@v6
        id: frontend
        with:
          context: frontend
          push: true
          tags: ghcr.io/${{ github.repository }}-frontend:${{ github.ref_name }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign release images
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}-backend@${{ steps.backend.outputs.digest }}
          cosign sign --yes ghcr.io/${{ github.repository }}-frontend@${{ steps.frontend.outputs.digest }}
