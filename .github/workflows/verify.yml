name: Verify

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Lint Python
        run: |
          python -m pip install --require-hashes -r backend/requirements-test.lock
          ruff check backend benchmarks scripts
          ruff format --check backend benchmarks scripts
          sh -n infra/compose/init-roles.sh
      - name: Create Compose test credentials
        run: |
          python - <<'PY'
          import json
          import os
          import secrets
          from pathlib import Path
          names = (
              "POSTGRES_PASSWORD", "POSTGRES_APP_PASSWORD", "POSTGRES_ADMIN_PASSWORD",
              "POSTGRES_WORKER_PASSWORD", "REDIS_PASSWORD", "AEGIS_CURSOR_SECRET", "AEGIS_METRICS_TOKEN",
          )
          os.umask(0o077)
          with (Path(os.environ["RUNNER_TEMP"]) / "aegis-ci.env").open("x") as env:
              for name in names:
                  env.write(f"{name}={secrets.token_hex(32)}\n")
              env.write("AEGIS_KEY_PEPPERS=" + json.dumps({"v1": secrets.token_hex(32)}) + "\n")
          PY
      - name: Validate and build the containers
        run: |
          docker compose --env-file "$RUNNER_TEMP/aegis-ci.env" --profile test config --quiet
          docker compose --env-file "$RUNNER_TEMP/aegis-ci.env" --profile test build backend tests
      - name: Start migrated services and run integration tests
        run: |
          docker compose --env-file "$RUNNER_TEMP/aegis-ci.env" up -d --wait --wait-timeout 90 backend worker
          docker compose --env-file "$RUNNER_TEMP/aegis-ci.env" --profile test run --rm -T tests
          curl --fail --silent --show-error http://127.0.0.1:8000/v1/health >/dev/null
      - name: Tear down the fixture
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/aegis-ci.env" ]; then
            docker compose --env-file "$RUNNER_TEMP/aegis-ci.env" --profile test down -v
            rm -f "$RUNNER_TEMP/aegis-ci.env"
          fi

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
      - name: Audit the Python locks
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit --no-deps --disable-pip -r backend/requirements.lock
          pip-audit --no-deps --disable-pip -r backend/requirements-test.lock
      - name: Audit the JavaScript lock
        run: npm --prefix frontend audit --audit-level=moderate
      - name: Scan Git history for secrets
        run: |
          scanner="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$scanner" |
            sha256sum --check --status
          tar -xzf "$scanner" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact=100 --no-banner --log-opts=--all .
