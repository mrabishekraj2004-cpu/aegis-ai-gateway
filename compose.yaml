x-base-env: &base-env
  AEGIS_ENVIRONMENT: local
  AEGIS_DATABASE_URL: postgresql+psycopg://aegis_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}@postgres:5432/aegis
  AEGIS_TRACE_ENDPOINT: ${AEGIS_TRACE_ENDPOINT:-}
x-aegis-env: &aegis-env
  <<: *base-env
  AEGIS_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  AEGIS_KEY_PEPPERS: ${AEGIS_KEY_PEPPERS:?generate AEGIS_KEY_PEPPERS}
  AEGIS_ACTIVE_PEPPER: ${AEGIS_ACTIVE_PEPPER:-v1}
  AEGIS_CURSOR_SECRET: ${AEGIS_CURSOR_SECRET:?generate AEGIS_CURSOR_SECRET}
  AEGIS_PROVIDER_CREDENTIALS: ${AEGIS_PROVIDER_CREDENTIALS:-}
  AEGIS_BREAKER_COLD_SECONDS: "0"
  AEGIS_OIDC_ISSUER: ${AEGIS_OIDC_ISSUER:-}
  AEGIS_OIDC_AUDIENCE: ${AEGIS_OIDC_AUDIENCE:-}
  AEGIS_OIDC_JWKS_URL: ${AEGIS_OIDC_JWKS_URL:-}
  AEGIS_ALLOWED_ORIGINS: ${AEGIS_ALLOWED_ORIGINS:-}
x-gateway-service: &gateway-service
  build:
    context: .
    dockerfile: backend/Dockerfile
  init: true
x-ready: &ready
  migrate:
    condition: service_completed_successfully
  redis:
    condition: service_healthy
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: aegis_migrator
      POSTGRES_DB: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD:?set POSTGRES_WORKER_PASSWORD}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/compose/init-roles.sh:/docker-entrypoint-initdb.d/010-aegis-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 2s
      retries: 20
  redis:
    image: redis:7.2-alpine
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
  migrate:
    <<: *gateway-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AEGIS_MIGRATION_DATABASE_URL: postgresql+psycopg://aegis_migrator:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/aegis
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
  backend:
    <<: *gateway-service
    depends_on: *ready
    environment:
      <<: *aegis-env
      AEGIS_METRICS_TOKEN: ${AEGIS_METRICS_TOKEN:?generate AEGIS_METRICS_TOKEN}
    ports:
      - "127.0.0.1:${AEGIS_HTTP_PORT:-8000}:8080"
    stop_grace_period: 105s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/health', timeout=1)"]
      interval: 5s
      timeout: 2s
      retries: 12
  worker:
    <<: *gateway-service
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["aegis-worker"]
    environment:
      <<: *base-env
      AEGIS_DATABASE_URL: postgresql+psycopg://aegis_worker_user:${POSTGRES_WORKER_PASSWORD:?set POSTGRES_WORKER_PASSWORD}@postgres:5432/aegis
      AEGIS_DB_POOL_SIZE: "2"
  admin:
    <<: *gateway-service
    profiles: [admin]
    depends_on: *ready
    entrypoint: ["aegis-admin"]
    environment:
      <<: *aegis-env
      AEGIS_ADMIN_DATABASE_URL: postgresql+psycopg://aegis_admin_user:${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}@postgres:5432/aegis
  tests:
    profiles: [test]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: tests
    depends_on: *ready
    environment:
      AEGIS_TEST_DATABASE_URL: postgresql+psycopg://aegis_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}@postgres:5432/aegis
      AEGIS_TEST_ADMIN_URL: postgresql+psycopg://aegis_admin_user:${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}@postgres:5432/aegis
      AEGIS_TEST_WORKER_URL: postgresql+psycopg://aegis_worker_user:${POSTGRES_WORKER_PASSWORD:?set POSTGRES_WORKER_PASSWORD}@postgres:5432/aegis
      AEGIS_TEST_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  collector:
    profiles: [otel]
    image: otel/opentelemetry-collector:0.147.0
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol/config.yaml:ro
volumes:
  postgres_data:
